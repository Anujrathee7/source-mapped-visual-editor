name: CI

on:
  push:
    branches: [main]
  pull_request:

# The whole suite runs without an API key: SVE_AGENT=fake is a deterministic
# in-process editor. CI never talks to a model, so it never costs tokens and
# never flakes on model phrasing. The live-agent suite is opt-in and local.
env:
  SVE_AGENT: fake

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Demo build
        run: npm run build -w @sve/demo

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
